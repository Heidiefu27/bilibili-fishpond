name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  score-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 语法检查
        run: node --check bilibili-fishpond.user.js
      - name: 打分回归（零依赖）
        run: node test/score-cases.mjs
